name: Release PubStar UnityPackage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(jq -r .version package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "❌ package.json missing version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag v$VERSION)"

      - name: Check if Tag exists
        id: check_tag
        env:
          # RELEASE_SDK_IOS is not a secret of this repository; github.token has
          # read access to it, and does not depend on the runner's own gh login.
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.pkg.outputs.tag }}"
          REMOTE_REPO="pubstar-io/PubStar-Unity-SDK"
          if gh api repos/$REMOTE_REPO/git/ref/tags/$TAG_NAME >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG_NAME does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve local Unity editor
        id: unity
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          EDITOR_VERSION=$(grep '^m_EditorVersion:' Samples~/Driver/ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          UNITY_BIN="/Applications/Unity/Hub/Editor/${EDITOR_VERSION}/Unity.app/Contents/MacOS/Unity"
          if [ ! -x "$UNITY_BIN" ]; then
            echo "❌ Unity editor not found: $UNITY_BIN"; exit 1
          fi
          echo "bin=$UNITY_BIN" >> "$GITHUB_OUTPUT"
          echo "Using Unity: $UNITY_BIN"

      - name: Build .unitypackage via Driver project
        if: steps.check_tag.outputs.exists == 'false'
        # Assets/PubStar holds only the C# layer. The native bridges the C# calls into
        # — the Android library with PubStarUnityBridge.java and the gradle dependency
        # on io.pubstar.mobile:ads, and the iOS PubstarUnityBridge.mm / Swift wrapper —
        # live under Assets/Plugins. Exporting Assets/PubStar alone shipped packages
        # (1.5.0, 1.6.0, 1.6.1) with no native code at all: AndroidNativeInvoker's
        # Java class did not exist and the iOS DllImport symbols could not link.
        run: |
          "${{ steps.unity.outputs.bin }}" \
            -batchmode -nographics -quit \
            -projectPath "Samples~/Driver" \
            -exportPackage "Assets/PubStar" "Assets/Plugins/Android/PubStar.androidlib" "Assets/Plugins/iOS/PubStar" "$GITHUB_WORKSPACE/PubStar.unitypackage" \
            -logFile -

      - name: Verify package contents
        if: steps.check_tag.outputs.exists == 'false'
        # Fail the release rather than publish a package that cannot work. Three
        # releases went out without native code because nothing looked inside.
        run: |
          rm -rf pkgcheck && mkdir pkgcheck
          tar -xzf "$GITHUB_WORKSPACE/PubStar.unitypackage" -C pkgcheck
          for d in pkgcheck/*/; do
            if [ -f "$d/asset" ]; then head -n 1 "$d/pathname" | tr -d '\r'; echo; fi
          done | sed '/^$/d' | sort > pkgcontents.txt
          cat pkgcontents.txt
          for required in \
            "Assets/PubStar/Scripts/Runtime/PubStar.cs" \
            "Assets/Plugins/Android/PubStar.androidlib/build.gradle" \
            "Assets/Plugins/Android/PubStar.androidlib/src/main/java/io/pubstar/unity/PubStarUnityBridge.java" \
            "Assets/Plugins/iOS/PubStar/PubstarUnityBridge.mm" \
            "Assets/Plugins/iOS/PubStar/PubstarAdManagerWrapper.swift"; do
            if ! grep -qxF "$required" pkgcontents.txt; then
              echo "::error::$required is missing from PubStar.unitypackage"
              exit 1
            fi
          done
          echo "All native bridges are in the package."

      - name: Zip project source code using git
        id: zip_step
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          ZIP_NAME="Pubstar.zip"
          git archive -o "$GITHUB_WORKSPACE/$ZIP_NAME" HEAD
          echo "zip_file=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          repository: pubstar-io/PubStar-Unity-SDK
          tag_name: ${{ steps.pkg.outputs.tag }}
          target_commitish: main
          name: ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            PubStar.unitypackage
            ${{ steps.zip_step.outputs.zip_file }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
